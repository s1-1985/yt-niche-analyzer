name: Turso Migration (one-time)

on:
  workflow_dispatch:   # GitHub Actions 画面の「Run workflow」ボタンで手動実行

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 実測見積もり30〜45分（タグ85万件含む）。余裕を持って120分

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "supabase>=2.0.0,<3.0.0" "libsql-client>=0.3.0,<0.4.0"

      - name: Run migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python turso/sync.py
